name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: HTML is up to date
        # en/*.html and de/*.html are generated from the Markdown next to them; locally: python3 tools/docs/build-manual.py
        run: python3 tools/docs/build-manual.py --check
